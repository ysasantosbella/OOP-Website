<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop Code Builder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dragdrop.css">
    <link rel="stylesheet" id="darkmode-style" href="../css/darkmode.css" disabled>
    <link rel="icon" type="image/png" href="assets/logoDark.png">
</head>
<body>

    <div id="navbar-root"></div>

    <header class="quiz-header">
        <h1>Interactive Code Builder</h1>
        <p class="lead">Form the correct Java program structure by arranging the blocks below.</p>
    </header>

    <div class="activity-container">
        <main class="activity-content">
            
            <section class="activity-card">
                <h4 class="section-label">01. Select OOP Concept</h4>
                <select id="conceptSelect" class="bubble-select" onchange="loadActivity()">
                    <option value="class">Class</option>
                    <option value="object">Object</option>
                    <option value="inheritance">Inheritance</option>
                    <option value="encapsulation">Encapsulation</option>
                </select>
            </section>

            <section class="activity-card">
                <h4 class="section-label">02. Arrange the Code</h4>
                <div id="code-container" class="list-group"></div>

                <div class="action-footer text-center">
                    <button class="bubble-btn" onclick="checkOrder()">Check Answer</button>
                    <p id="result" class="mt-4"></p>
                </div>
            </section>

        </main>
    </div>

    <div id="footer-root"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/dragdrop.js"></script>
    <script src="../js/darkmode.js"></script>
</body>
</html>
