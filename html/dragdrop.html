<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drag & Drop Code Builder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dragdrop.css">
    <link rel="stylesheet" id="darkmode-style" href="../css/darkmode.css" disabled>

</head>

<body>

<!-- NAVBAR -->
<!-- The navigation bar is injected here using navbar.js -->
<div id="navbar-root"></div>

    <header class="bg-primary text-white text-center p-5">
        <h1>Drag & Drop Code Builder</h1>
        <p>Arrange the code to form the correct Java program</p>
    </header>


    <div class="container mt-5">

        <h4>Select OOP Concept</h4>

        <select id="conceptSelect" class="form-select mb-4" onchange="loadActivity()">

            <option value="class">Class</option>
            <option value="object">Object</option>
            <option value="inheritance">Inheritance</option>
            <option value="encapsulation">Encapsulation</option>

        </select>


        <div id="code-container" class="list-group"></div>

        <br>

        <button class="btn btn-success" onclick="checkOrder()">Check Answer</button>

        <p id="result" class="mt-3 mb-5"></p>

    </div>


<div id="footer-root"></div>



    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/dragdrop.js"></script>
    <script src="../js/darkmode.js"></script>

</body>

</html>
